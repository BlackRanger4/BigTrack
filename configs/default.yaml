  ostrack_vitb_256_mae_32x4_ep300:
    type: ostrack
    config:
      config_path: ignores/Models/Ostrack/config/vitb_256_mae_32x4_ep300.yaml
      checkpoint_path: ignores/Models/Ostrack/models/vitb_256_mae_32x4_ep300/OSTrack_ep0300.pth.tar
      device: cuda
