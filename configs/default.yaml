# Default BigTracker component configuration.
#
# Paths are relative to the repository root.  `use` selects one entry from
# each section; the other entries are ready-to-use alternatives.

pipeline:
  predictor: adaptive_kalman
  matcher: mixformerv2_288_depth8_score
  policy: score_gated

predictors:
  use: adaptive_kalman

  adaptive_kalman:
    type: adaptive_kalman
    config:
      process_noise_position: 1.0
      measurement_noise_position: 4.0
      default_covariance: [10.0, 0.0, 0.0, 10.0]
      adaptive_measurement_noise: true
      min_measurement_noise_scale: 0.25
      max_measurement_noise_scale: 3.0
      min_uncertainty: 0.0
      max_uncertainty: 100.0
      reject_uncertainty_growth: 1.5
      reject_covariance_growth: 1.15
      reject_velocity_damping: 0.85
      max_position_velocity: null
      uncertainty_accept_decay: 0.90

  kalman:
    type: kalman
    config:
      process_noise_position: 1.0
      measurement_noise_position: 4.0
      default_covariance: [10.0, 0.0, 0.0, 10.0]
      reject_uncertainty_growth: 1.5
      min_uncertainty: 0.0
      max_uncertainty: 100.0

  alpha_beta:
    type: alpha_beta
    config:
      alpha_position: 0.85
      beta_position: 0.20
      max_position_velocity: null
      max_position_acceleration: null
      reject_velocity_damping: 0.85
      reject_uncertainty_growth: 1.0
      accept_uncertainty_decay: 0.85
      min_uncertainty: 0.0
      max_uncertainty: 100.0

  history:
    type: history
    config:
      history_length: 8
      velocity_window: 4
      velocity_smoothing: 0.60
      max_position_velocity: null
      max_position_acceleration: null
      reject_velocity_damping: 0.85
      reject_uncertainty_growth: 1.0
      accept_uncertainty_decay: 0.90
      min_uncertainty: 0.0
      max_uncertainty: 100.0

  matcher_target:
    type: matcher_target
    config: {}

  constant_accel_kalman:
    type: constant_accel_kalman
    config:
      process_noise_position: 1.0
      process_noise_velocity: 0.5
      process_noise_acceleration: 0.25
      measurement_noise_position: 4.0
      default_covariance: [10.0, 0.0, 0.0, 0.0, 10.0, 0.0, 0.0, 0.0, 10.0]
      adaptive_measurement_noise: true
      min_measurement_noise_scale: 0.25
      max_measurement_noise_scale: 3.0
      max_position_velocity: null
      max_position_acceleration: null
      reject_velocity_damping: 0.85
      reject_acceleration_damping: 0.65
      reject_uncertainty_growth: 1.5
      reject_covariance_growth: 1.15
      uncertainty_accept_decay: 0.90
      min_uncertainty: 0.0
      max_uncertainty: 100.0

matchers:
  use: mixformerv2_288_depth8_score

  # No external model files required; useful as a lightweight baseline.
  fft:
    type: fft
    config:
      template_area_factor: 2.0
      search_area_factor: 2.5
      uncertain_search_area_factor: 3.25
      recovery_search_area_factor: 4.0
      min_crop_size: 16
      max_best_templates: 5
      peak_exclusion_radius: 8

  nanotrack_v1:
    type: nanotrack
    config:
      backend: onnx
      config_path: ignores/Models/nanotrack/config/configv1.yaml
      checkpoint_path: ignores/Models/nanotrack/pretrained/nanotrackv1.pth
      backbone_path: ignores/Models/nanotrack/nanotrackv1/nanotrack_backbone_sim.onnx
      template_backbone_path: null
      search_backbone_path: null
      head_path: ignores/Models/nanotrack/nanotrackv1/nanotrack_head_sim.onnx
      onnx_provider: cpu
      device: null
      max_best_templates: 5
      context_amount: 0.5
      exemplar_size: 127
      instance_size: 255
      output_size: 16
      point_stride: 16
      cls_out_channels: 2
      penalty_k: 0.148
      window_influence: 0.462
      lr: 0.390
      min_box_size: 10.0

  nanotrack_v2:
    type: nanotrack
    config:
      backend: onnx
      config_path: ignores/Models/nanotrack/config/configv2.yaml
      checkpoint_path: ignores/Models/nanotrack/pretrained/nanotrackv2.pth
