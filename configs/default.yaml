policies:
  use: score_gated

  score_gated:
    type: score_gated
    config:
      th_good: 0.70
      th_bad: 0.30
      max_center_error: 0.35
      max_size_error: 0.50
      predictor_uncertainty_scale: 10.0
      recovery_after: 3
      lost_after: 10
      template_update_interval: 5
      template_allow_clipped: false

  simple:
    type: simple
    config: {}

runner:
  config:
    window_name: BigTracker
    debug_window_name: BigTracker debug
    window_width: 1280
    window_height: 720
    debug_width: 1280
    debug_height: 720
    show_debug_window: true
    debug_history_length: 3
    debug_history_min_alpha: 0.08
    debug_history_max_alpha: 0.60
    start_paused: true
    continuous: false
    frame_delay_ms: 1
    windows_timer_resolution_ms: 1
    draw_tracker_box: true
    draw_key_help: true
    max_timing_samples: 300
    log_jsonl: false
    log_path: logs/bigtrack_fulltest.jsonl
