      device: null
      max_best_templates: 5
      context_amount: 0.5
      exemplar_size: 127
      instance_size: 255
      output_size: 16
      point_stride: 16
      cls_out_channels: 2
      penalty_k: 0.150
      window_influence: 0.490
      lr: 0.385
      min_box_size: 10.0

  nanotrack_v3:
